# Build System Configuration
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["teralibs"]


# Project Core Metadata & Dynamic Entry Points
[project]
name = "terasploit-framework"
version = "1.0.0-dev.1"
description = "Exploitation Framework for Cross-Platform Red Team Operations"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "4steroth", email = "asteroth.git@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Environment :: Console",
    "Topic :: Security",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "impacket",
    "paramiko",
]


# Script Distribution (PEP 517 Console Entry Points)
[project.scripts]
# pip generates a portable wrapper shim for each entry point.
# Works correctly for both `pip install` and `pip install -e .`.
teraconsole = "teralibs.terasploit.framework.console.tsf:main"
terax       = "teralibs.tsf.terax.generator:main"


# Global Ruff Settings
[tool.ruff]
# Matches the Python version actually running this project.
target-version = "py314"

# Max line length. The codebase sits comfortably under 150 chars except for
# a handful of shellcode/binary literal lines that must not be wrapped.
line-length = 150

# Lint/format source trees and root-level entry scripts.
include = [
    "teraconsole",
    "terax",
    "teralibs/**/*.py",
    "modules/**/*.py"
]


# Ruff Linting Rules
[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors   — spacing, indentation, syntax
    "W",    # pycodestyle warnings — whitespace, blank lines
    "I",    # isort                — import ordering and grouping
    "UP",   # pyupgrade            — modernise to Python 3.14 idioms
    "B",    # flake8-bugbear       — subtle bugs and bad practices
    "SIM",  # flake8-simplify      — suggest simpler equivalents
    "RUF",  # Ruff-specific        — redundant noqa, mutable defaults, etc.
    "F",    # pyflakes             — unused imports/vars, undefined names.
            # Verified low-impact: 4 findings codebase-wide, all trivial
            # and auto-fixable (stray f-strings, one unused import).
]


# Ruff Plugin Tooling & Advanced Aesthetics
[tool.ruff.lint.isort]
# Treat internal libs as first-party so isort groups them separately from
# third-party packages (scapy, impacket, etc.).
known-first-party = ["libs", "modules"]

# Clean double spacing layout for import headers
lines-after-imports = 2
combine-as-imports  = true

[tool.ruff.lint.flake8-tidy-imports]
# Ban relative imports (`from ..libs import x`) to keep the payload module
# loading paths explicitly clean and transparent.
ban-relative-imports = "all"


# Ruff Formatter Settings
[tool.ruff.format]
# Double quotes throughout — the codebase uses ~3160 double vs ~317 single.
quote-style = "double"

# 4-space indentation — standard across all files.
indent-style = "space"

# Trailing commas in multi-line structures — keeps git diffs incredibly clean.
skip-magic-trailing-comma = false

# Automatically style your docstrings to wrap properly and use consistent spacing.
docstring-code-format = true
docstring-code-line-length = 80


# Pyright Type Checker Settings
[tool.pyright]
pythonVersion = "3.14"

# Source roots so pyright resolves `from teralibs.x import y` correctly
# without needing an installed package or sys.path hacks.
extraPaths = ["."]
include    = ["teralibs/**/*.py", "modules**/*.py"]

# Basic mode — reports real errors without demanding annotations everywhere.
# Switch to "standard" once the codebase is fully annotated.
typeCheckingMode = "standard"

# Pylint Format
[tool.pylint.format]
max-line-length = 150

# Legacy Pylint Message Controls
[tool.pylint.messages_control]
# These are the things not worth paying attention to.
# Rest assured that variables are named appropriately.
disable = [
    "C0114",  # missing-module-docstring
    "C0302",  # too-many-lines
]